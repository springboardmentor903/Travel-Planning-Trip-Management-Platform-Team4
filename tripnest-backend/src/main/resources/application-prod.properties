# ===================================================
# TripNest Production Configuration Profile (prod)
# ===================================================
spring.application.name=tripnest-backend

# Database Source (Must be supplied via environment variables in hosting platform)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tripnestdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Production Settings
# Production safety rule: Schema DDL is validated against database, no auto schema modification
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Settings (JWT_SECRET must be supplied via production environment variable)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Weather API Key
weather.api.key=${WEATHER_API_KEY}
openweather.api.key=${WEATHER_API_KEY}

# Google OAuth Client ID
google.client.id=${GOOGLE_CLIENT_ID}

# Production CORS Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tripnest.app,https://www.tripnest.app}

# Logging Levels (Disable debug/trace logs in production)
logging.level.root=WARN
logging.level.com.tripnest.tripnest_backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
