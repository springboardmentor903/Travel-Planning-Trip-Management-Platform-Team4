spring.application.name=tripnest-backend


spring.profiles.active=env
# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/tripnestdb
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# Weather API
# ===============================
weather.api.key=${WEATHER_API_KEY:e83cc1c0948b4a894c9593f4df92bcd7}
openweather.api.key=${WEATHER_API_KEY:e83cc1c0948b4a894c9593f4df92bcd7}

